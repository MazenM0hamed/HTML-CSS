<html>
  <head>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="header">
      <div class="container">
        <img class="logo" src="images/logo.png" />
        <div class="line"></div>
      </div>
    </header>

    <section class="first-post">
      <div class="section-container">
        <div class="post-header">
          <div class="header-details">
            <h1>Vincent van gough</h1>
            <p>Zudert,Netherlands</p>
          </div>

          <div class="header-avatar">
            <img class="post-avatar" src="images/avatar-vangogh.jpg" />
          </div>
        </div>
        <div class="post-img-section">
          <img class="post-img" src="images/post-vangogh.jpg" />
        </div>
        <div class="interactions">
          <img class="heart" src="images/icon-heart.png" />
          <img class="comment" src="images/icon-comment.png" />
          <img class="dm" src="images/icon-dm.png" />
        </div>

        <h5>21000 likes</h5>
        <p><span>Vincey766</span> just took a few mushrooms lol</p>
      </div>
    </section>
    <script href="script.js"></script>

</html>
